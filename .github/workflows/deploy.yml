name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege. `contents: read` is all the build needs; `pages` and
# `id-token` are what deploy-pages requires for OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queued runs wait rather than cancel, so a menu edit
# made mid-deploy still lands.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Every action is pinned to a commit SHA rather than a tag. Tags are
      # mutable: whoever controls the upstream repo can repoint v5 at new code,
      # which would then run in this workflow. The comment records the tag the
      # SHA corresponded to when it was pinned.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # `base_path` is '' for a user/org site or a custom domain, and
      # '/captains-cabin' for a project site. lib/paths.js and next.config.mjs
      # both read it, which is what lets one build target either address.
      #
      # SITE_URL is the permanent address, not this mirror's: every canonical,
      # og:url and sitemap entry points at captainscabin.pages.dev so the two
      # copies never compete in search.
      - name: Build
        run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: https://captainscabin.pages.dev

      # Gate: a build that leaks a secret, drops a canonical, loses alt text or
      # regresses the CSP must not reach production.
      #
      # This needs the SAME env as the build. The checker resolves references
      # back to disk by stripping the base path, so without it every prefixed
      # reference looks like a missing file.
      - name: Verify build
        run: node scripts/verify-build.mjs
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: https://captainscabin.pages.dev

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # The permanent address. Built separately because it serves from the root:
  # no PAGES_BASE_PATH, and SITE_URL falls back to the pages.dev default in
  # lib/site.js. This is what makes CMS edits reach captainscabin.pages.dev.
  #
  # Needs the repo secret CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages >
  # Edit). Until it exists every step below is skipped, so the job passes.
  cloudflare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: f71a9d0fd5bd7ea7a5aa3781cd02374a
    steps:
      - name: Checkout
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Node.js
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci

      - name: Build
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run build

      - name: Verify build
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node scripts/verify-build.mjs

      # Version pinned for the same reason the actions are pinned to SHAs.
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4.149.0 pages deploy out --project-name captainscabin --branch main
