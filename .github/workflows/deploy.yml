name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege. `contents: read` is all the build needs; `pages` and
# `id-token` are what deploy-pages requires for OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queued runs wait rather than cancel, so a menu edit
# made mid-deploy still lands.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Every action is pinned to a commit SHA rather than a tag. Tags are
      # mutable: whoever controls the upstream repo can repoint v5 at new code,
      # which would then run in this workflow. The comment records the tag the
      # SHA corresponded to when it was pinned.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # `base_path` is '' for a user/org site or a custom domain, and
      # '/captains-cabin' for a project site. lib/paths.js and next.config.mjs
      # both read it, which is what lets one build target either address.
      - name: Build
        run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.origin }}${{ steps.pages.outputs.base_path }}

      # Gate: a build that leaks a secret, drops a canonical, loses alt text or
      # regresses the CSP must not reach production.
      - name: Verify build
        run: node scripts/verify-build.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
